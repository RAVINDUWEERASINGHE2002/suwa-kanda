services:
  suwa-kanda:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: suwa_kanda_pos
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - NODE_ENV=production
      - DB_PATH=/app/data/suwa_kanda.db
    volumes:
      # Persist SQLite database file and WAL logs across restarts
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
