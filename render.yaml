services:
  - type: web
    name: suwa-kanda-pos
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm run build
    startCommand: node server/src/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
